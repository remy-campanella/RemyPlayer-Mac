[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remyplayer"
version = "0.0.0"
description = "A personal, read-only local music player for macOS"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.10,<7",
    "mutagen>=1.47,<2",
    "pypinyin>=0.55,<1",
    "pyobjc-framework-Cocoa>=12,<13; sys_platform == 'darwin'",
]

[project.scripts]
remyplayer = "remyplayer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remyplayer = ["resources/*.svg", "resources/*.icns"]
